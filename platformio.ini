; Tesserae client for the Pimoroni Inky Frame 7.3" (Raspberry Pi Pico W, RP2040).
;
; Framework: the official Raspberry Pi Pico SDK ("picosdk") as packaged by the
; maxgerhardt fork of the PlatformIO raspberrypi platform. The W board pulls in
; the CYW43 driver and lwIP; include/lwipopts.h configures lwIP.

[platformio]
default_envs = inkyframe

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = picosdk
build_flags =
    -DPIO_STDIO_USB
    -Wall -Wextra -Wno-unused-parameter
extra_scripts =
    pre:scripts/lwip_prepend.py
    pre:scripts/version_defines.py
    pre:scripts/tls_paths.py
    post:scripts/tls_libs.py
; Ed25519 for verifying signed updates: Monocypher 4.0.3, pinned to the same
; commit as tesserae-device-firmware.
lib_deps =
    https://github.com/LoupVaillant/Monocypher.git#ab2b16dd619ad5f6979a4fbe69cfa324a6fcc35f
monitor_speed = 115200
upload_port = /dev/cu.usbmodem*

; Production build for the original 7-colour (ACeP) Inky Frame 7.3".
[env:inkyframe]
build_flags =
    ${env.build_flags}
    -DINKY_LOW_RAM=1
    -DPANEL_VARIANT=PANEL_ACEP

; Same firmware for a Spectra 6 (E673) panel, the revision shipped from Sept 2025.
[env:inkyframe_spectra]
build_flags =
    ${env.build_flags}
    -DINKY_LOW_RAM=1
    -DPANEL_VARIANT=PANEL_SPECTRA

; Bench self-test: no Tesserae involved. Downloads and paints tools/make_test_frames.py
; output from a local HTTP server (python3 -m http.server 8000 in the tools folder).
[env:inkyframe_selftest]
build_flags =
    ${env.build_flags}
    -DPANEL_VARIANT=PANEL_ACEP
    -DDEV_BOOT_LOG_DELAY_MS=3000
    -DSELFTEST_BASE_URL=\"http://192.168.1.153:8000\"

; Spectra 6 Inky Frame with a Pico 2 W (RP2350) aboard: the board Pimoroni
; ships the Spectra revision with.
[env:inkyframe2_spectra]
board = rpipico2w
build_flags =
    ${env.build_flags}
    -DPANEL_VARIANT=PANEL_SPECTRA

; The over-the-air image for the Pico 2 W Spectra Frame: the same firmware,
; marked "try before you buy" so the boot ROM runs it once and returns to the
; previous image unless it confirms (src/ota.h). Signed and published by the
; release workflow; not for USB flashing, which uses inkyframe2_spectra.
[env:inkyframe2_spectra_ota]
board = rpipico2w
build_flags =
    ${env.build_flags}
    -DPANEL_VARIANT=PANEL_SPECTRA
    -DPICO_CRT0_IMAGE_TYPE_TBYB=1

; ---- bench builds for testing OTA without a Tesserae release ---------------
; They trust the published TEST signing key and also fetch a descriptor from
; OTA_BENCH_DESCRIPTOR_URL each wake (tools/ota_bench.sh serves one). Never
; ship these: the test key's private half is public.
[bench]
build_flags =
    ${env.build_flags}
    -DPANEL_VARIANT=PANEL_SPECTRA
    -DOTA_TRUST_TEST_KEY=1
    -DOTA_BENCH_DESCRIPTOR_URL=\"http://192.168.50.80:8000/descriptor.json\"

[env:bench2_spectra]
board = rpipico2w
build_flags = ${bench.build_flags}

[env:bench2_spectra_ota]
board = rpipico2w
build_flags = ${bench.build_flags}
    -DPICO_CRT0_IMAGE_TYPE_TBYB=1

[env:bench2_spectra_ota_noconfirm]
board = rpipico2w
build_flags = ${bench.build_flags}
    -DPICO_CRT0_IMAGE_TYPE_TBYB=1
    -DOTA_BENCH_NEVER_CONFIRM=1
